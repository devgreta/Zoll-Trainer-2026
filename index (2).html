function tier(score){return score>=90?'Gold':score>=75?'Silver':score>=60?'Bronze':tr('pass')}
function results(){let a=state.lastAttempt||state.attempts[0]; if(!a)return history(); let wrong=a.total-a.correct; app.innerHTML=`${topbar()}<main class="wrap"><section class="card"><div class="between"><div><h1>${tr('results')}</h1><p class="muted">${safeText(a.user.name)} · ${new Date(a.date).toLocaleString()}</p></div><div class="kpi"><b>${a.score}%</b><div>${tier(a.score)}</div></div></div><div class="grid"><div class="kpi"><b>${a.correct}/${a.total}</b><div>${tr('correct')}</div></div><div class="kpi"><b>${fmt(a.timeTaken)}</b><div>${tr('timeTaken')}</div></div><div class="kpi"><b>${safeText(a.mode)}</b><div>${tr('mode')}</div></div><div class="kpi"><b>${safeText(a.cat)}</b><div>${tr('category')}</div></div></div><div class="grid"><div class="card chartbox"><canvas id="donut"></canvas></div><div class="card chartbox"><canvas id="catChart"></canvas></div><div class="card chartbox"><canvas id="diffChart"></canvas></div></div><h3>Empfehlung</h3><p>${recommend(a)}</p><div class="row no-print"><button class="btn" onclick="downloadCertificate()">${tr('downloadCert')}</button><button class="btn secondary" onclick="window.print()">${tr('print')}</button><button class="btn ghost" onclick="state.view='setup';render()">${tr('retake')}</button><button class="btn ghost" onclick="state.view='history';render()">${tr('history')}</button></div></section><section class="card"><div class="between"><h2>${tr('review')}</h2><select onchange="state.filter=this.value;render()"><option value="all">${tr('all')}</option><option value="correct">${tr('correct')}</option><option value="incorrect">${tr('incorrect')}</option><option value="bookmarked">${tr('bookmarked')}</option><option value="flagged">${tr('flagged')}</option></select></div><div>${reviewHtml(a)}</div></section></main>`; setTimeout(()=>drawCharts(a,wrong),50)}
function reviewHtml(a){return a.questions.map((q,i)=>{let ans=a.answers[q.id]||[],ok=isCorrect(q,ans); if(state.filter==='correct'&&!ok)return''; if(state.filter==='incorrect'&&ok)return''; if(state.filter==='bookmarked'&&!q.bookmarked)return''; if(state.filter==='flagged'&&!q.flagged)return''; return `<div class="review-item"><div class="between"><b>${i+1}. ${safeText(q.category)}</b><span class="badge">${ok?tr('correct'):tr('incorrect')} · ${safeText(q.difficulty)}</span></div><p>${safeText(q.questionText)}</p><p><b>${tr('correct')}:</b> ${safeText(Array.isArray(q.correctAnswer)?q.correctAnswer.join(', '):q.correctAnswer)} | <b>Ihre Antwort:</b> ${safeText(ans.join(', ')||'-')}</p><p>${safeText(q.explanation)}</p></div>`}).join('')}
function recommend(a){let weak=Object.entries(a.byCat).sort((x,y)=>(x[1].c/x[1].t)-(y[1].c/y[1].t))[0]; if(a.score<60)return `Wiederholen Sie zunächst den Lernmodus und üben Sie gezielt ${weak?weak[0]:'Ihre schwächste Kategorie'}.`; if(a.score<75)return `Solide Grundlage. Trainieren Sie falsche und markierte Fragen erneut, besonders ${weak?weak[0]:''}.`; if(a.score<90)return `Gute Leistung. Versuchen Sie nun einen vollständigen Prüfungsmodus mit höherem Zeitdruck.`; return `Sehr starke Leistung. Halten Sie das Niveau mit kurzen Wiederholungen und schweren Fragen.`}
function drawCharts(a,wrong){if(!window.Chart)return; new Chart($('#donut'),{type:'doughnut',data:{labels:[tr('correct'),tr('incorrect')],datasets:[{data:[a.correct,wrong]}]}}); new Chart($('#catChart'),{type:'bar',data:{labels:Object.keys(a.byCat),datasets:[{label:'%',data:Object.values(a.byCat).map(x=>Math.round(x.c/x.t*100))}]},options:{scales:{y:{beginAtZero:true,max:100}}}}); new Chart($('#diffChart'),{type:'bar',data:{labels:Object.keys(a.byDiff),datasets:[{label:'%',data:Object.values(a.byDiff).map(x=>Math.round(x.c/x.t*100))}]},options:{scales:{y:{beginAtZero:true,max:100}}}})}
function history(){let avg=state.attempts.length?Math.round(state.attempts.reduce((s,a)=>s+a.score,0)/state.attempts.length):0,best=Math.max(0,...state.attempts.map(a=>a.score)); app.innerHTML=`${topbar()}<main class="wrap"><section class="card"><div class="between"><h1>${tr('history')}</h1><button class="btn" onclick="state.view='setup';render()">${tr('home')}</button></div><div class="grid"><div class="kpi"><b>${state.attempts.length}</b><div>Versuche</div></div><div class="kpi"><b>${best}%</b><div>Beste Leistung</div></div><div class="kpi"><b>${avg}%</b><div>Durchschnitt</div></div></div><div class="card chartbox"><canvas id="histChart"></canvas></div>${state.attempts.map(a=>`<div class="review-item"><div class="between"><b>${new Date(a.date).toLocaleString()} — ${a.score}%</b><span>${a.correct}/${a.total} · ${safeText(a.mode)} · ${safeText(a.cat)}</span></div></div>`).join('')||'<p class="muted">Noch keine Versuche.</p>'}</section></main>`; setTimeout(()=>{if(window.Chart&&$('#histChart'))new Chart($('#histChart'),{type:'line',data:{labels:state.attempts.slice().reverse().map((a,i)=>String(i+1)),datasets:[{label:'Score %',data:state.attempts.slice().reverse().map(a=>a.score)}]},options:{scales:{y:{beginAtZero:true,max:100}}}})},50)}
function showAdminLogin(){app.insertAdjacentHTML('beforeend',`<div class="modal" id="adminLogin"><div class="card"><h2>${tr('admin')}</h2><label>${tr('password')}</label><input class="input" id="adminPw" type="password"><p id="adminErr" style="color:var(--error)"></p><div class="row"><button class="btn" onclick="checkAdmin()">${tr('access')}</button><button class="btn ghost" onclick="$('#adminLogin').remove()">${tr('close')}</button></div></div></div>`)}
function checkAdmin(){if($('#adminPw').value===state.settings.adminPassword){$('#adminLogin').remove();state.view='admin';render()}else $('#adminErr').textContent=tr('wrongAdmin')}
function admin(){app.innerHTML=`${topbar()}<main class="wrap"><h1>${tr('admin')}</h1><div class="admin-layout"><aside class="card admin-menu">${['dashboard','questions','settings','analytics','data'].map(t=>`<button class="btn ${state.adminTab===t?'':'ghost'}" onclick="state.adminTab='${t}';render()">${tr(t)}</button>`).join('')}<button class="btn secondary" onclick="state.view='setup';render()">${tr('home')}</button></aside><section class="card">${adminContent()}</section></div></main>`}
function adminContent(){if(state.adminTab==='dashboard'){let active=state.questions.filter(q=>q.active!==false).length,avg=state.attempts.length?Math.round(state.attempts.reduce((s,a)=>s+a.score,0)/state.attempts.length):0;return `<div class="grid"><div class="kpi"><b>${state.questions.length}</b><div>Total questions</div></div><div class="kpi"><b>${active}</b><div>Active</div></div><div class="kpi"><b>${state.attempts.length}</b><div>Local attempts</div></div><div class="kpi"><b>${avg}%</b><div>Average score</div></div></div>`} if(state.adminTab==='questions')return adminQuestions(); if(state.adminTab==='settings')return adminSettings(); if(state.adminTab==='analytics')return `<h2>${tr('analytics')}</h2><p class="muted">Lokale Analyse: Versuche ${state.attempts.length}. Schwierige Fragen werden aus falschen Antworten der lokalen Historie berechnet.</p>${missedQuestions()}`; return adminData()}
function adminQuestions(){let rows=state.questions.map(q=>`<tr><td>${q.id}</td><td>${safeText(q.category)}</td><td>${safeText(q.difficulty)}</td><td>${safeText(q.questionText).slice(0,80)}</td><td><button class="btn ghost" onclick="editQ(${q.id})">${tr('edit')}</button><button class="btn danger" onclick="delQ(${q.id})">${tr('delete')}</button></td></tr>`).join('');return `<div class="between"><h2>${tr('questions')}</h2><button class="btn" onclick="addQ()">${tr('add')}</button></div><p class="small muted">Importe aus Word/CSV/JSON müssen in Schema id, section, category, type, text, options, correctAnswer, explanation, difficulty, active normalisiert werden.</p><div style="overflow:auto"><table width="100%"><thead><tr><th>ID</th><th>Category</th><th>Difficulty</th><th>Question</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}
function editQ(id){let q=state.questions.find(x=>x.id===id);let nt=prompt('Question text',q.questionText); if(nt!==null){q.questionText=nt;storage.set('zt_questions',state.questions);render()}}
function delQ(id){if(confirm('Delete question?')){state.questions=state.questions.filter(q=>q.id!==id);storage.set('zt_questions',state.questions);render()}}
function addQ(){let id=Math.max(...state.questions.map(q=>q.id))+1;state.questions.push({id,section:'Admin',category:'Zollrecht',questionText:'Neue Frage',questionType:'single_choice',options:['A','B','C','D'],correctAnswer:'A',explanation:'Erklärung ergänzen.',difficulty:'medium',active:true,bookmarked:false,flagged:false});storage.set('zt_questions',state.questions);render()}
function adminSettings(){return `<h2>${tr('settings')}</h2>${['accessPassword','adminPassword','questionsPerQuiz','timerMinutes','passThreshold','brand'].map(k=>`<label>${k}</label><input class="input" id="s_${k}" value="${safeText(state.settings[k])}">`).join('')}<button class="btn" onclick="saveSettings()">${tr('save')}</button>`}
function saveSettings(){Object.keys(DEFAULT_SETTINGS).forEach(k=>{let el=$('#s_'+k);if(el)state.settings[k]=isNaN(Number(el.value))?el.value:Number(el.value)});storage.set('zt_settings',state.settings);render()}
function adminData(){return `<h2>${tr('data')}</h2><div class="row"><button class="btn" onclick="downloadJSON('questions',state.questions)">${tr('export')} Fragen JSON</button><button class="btn" onclick="downloadJSON('attempts',state.attempts)">${tr('export')} CSV/JSON</button></div><label>${tr('import')} Fragen JSON</label><input type="file" class="input" accept="application/json" onchange="importQuestions(event)">`}
function missedQuestions(){let counts={};state.attempts.forEach(a=>a.questions.forEach(q=>{if(!isCorrect(q,a.answers[q.id]||[]))counts[q.id]=(counts[q.id]||0)+1}));return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,n])=>`<p>Frage ${id}: ${n}× falsch</p>`).join('')||'<p>Keine Daten.</p>'}
function downloadJSON(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zoll-${name}.json`;a.click()}
function importQuestions(ev){let f=ev.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{let data=JSON.parse(r.result); if(!Array.isArray(data))throw Error(); state.questions=data;storage.set('zt_questions',data);alert('Import ok');render()}catch{alert('Ungültige JSON-Datei')}}; r.readAsText(f)}
function downloadCertificate(){let a=state.lastAttempt||state.attempts[0]; try{const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}); let certId=`ZT2026-${Date.now()}-${Math.random().toString(36).slice(2,7).toUpperCase()}`; doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(30,64,175);doc.setLineWidth(2);doc.rect(12,12,273,186);doc.setFont('helvetica','bold');doc.setFontSize(25);doc.text('ZOLL TRAINER 2026',148,38,{align:'center'});doc.setFontSize(18);doc.text(tr('certificate'),148,58,{align:'center'});doc.setFont('helvetica','normal');doc.setFontSize(13);doc.text(`${a.user.name}`,148,82,{align:'center'});doc.text(`${tr('score')}: ${a.score}% — ${tier(a.score)}`,148,98,{align:'center'});doc.text(`Datum: ${new Date(a.date).toLocaleDateString()}   ID: ${certId}`,148,114,{align:'center'});doc.setFont('helvetica','italic');doc.setFontSize(20);doc.text('Greta Wernhoff',148,142,{align:'center'});doc.setFontSize(9);doc.text(tr('certDisclaimer'),148,184,{align:'center',maxWidth:250});doc.save(`zoll-trainer-zertifikat-${certId}.pdf`)}catch(e){alert('PDF generation failed. Use print instead.')}}
function beep(freq){if(!state.settings.sounds)return; try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.value=.03;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>{o.stop();ctx.close()},120)}catch{}}
function downloadCSV(){ }
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.remove()); if(state.view!=='quiz')return; if(['a','b','c','d'].includes(e.key.toLowerCase()))selectAnswer(e.key.toUpperCase()); if(e.key==='ArrowRight')nextQ(); if(e.key==='ArrowLeft')prevQ();});
applyTheme();render();
</script>
</body></html>
